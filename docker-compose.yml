name: skyroute-weather-api

services:
  api:
    build: .
    ports:
      - "8010:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      db_historico:
        condition: service_healthy
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - skyroute_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
  db_historico:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_HISTORICO_DB}
    ports:
      - "5434:5432"
    volumes:
      - skyroute_historico:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_HISTORICO_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  skyroute_data:
  skyroute_historico:
